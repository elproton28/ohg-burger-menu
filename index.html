<!-- 1. Cargar SDKs de Firebase (compatibles) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
  // 2. Configuración de tu proyecto Firebase
  // Reemplaza las comillas con los datos de tu consola de Firebase
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    projectId: "TU_PROYECTO_ID",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  // 3. Cargar y renderizar la galería en tiempo real desde Firestore
  function renderGallery() {
    const container = document.getElementById('galleryContainer');

    db.collection('photos').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No hay fotos disponibles.</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const photo = doc.data();
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${photo.img}" alt="${photo.title}">
          <h3>${photo.title}</h3>
        `;
        container.appendChild(item);
      });
    }, (error) => {
      console.error("Error al obtener imágenes: ", error);
    });
  }

  // 4. Función para guardar/subir un nuevo producto o foto
  async function saveProduct(title, fileInputOrUrl) {
    try {
      let imageUrl = '';

      // Si se seleccionó un archivo de imagen desde el teléfono/computadora
      if (fileInputOrUrl instanceof File) {
        const storageRef = storage.ref(`gallery_photos/${Date.now()}_${fileInputOrUrl.name}`);
        const uploadTask = await storageRef.put(fileInputOrUrl);
        imageUrl = await uploadTask.ref.getDownloadURL();
      } else {
        // Si se ingresó una URL de imagen directamente
        imageUrl = fileInputOrUrl;
      }

      // Guardar el registro en la base de datos Firestore
      await db.collection('photos').add({
        title: title,
        img: imageUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      console.log("¡Foto o platillo subido correctamente!");
    } catch (error) {
      console.error("Error al guardar en Firebase: ", error);
      alert("Hubo un error al subir la imagen: " + error.message);
    }
  }

  // Inicializar la galería al cargar la página
  document.addEventListener('DOMContentLoaded', () => {
    renderGallery();
  });
</script>
