<!-- 1. Cargar las librerías compatibles de Firebase en el HTML -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
  // 2. Tu configuración exacta de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCCJ8p6ilUahYV6f4DWQUFJY01UXFZWK4",
    authDomain: "ohg-burger-db.firebaseapp.com",
    databaseURL: "https://ohg-burger-db-default-rtdb.firebaseio.com",
    projectId: "ohg-burger-db",
    storageBucket: "ohg-burger-db.firebasestorage.app",
    messagingSenderId: "1049128717641",
    appId: "1:1049128717641:web:b31aafda03ff1a4dca9e98"
  };

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  // 3. Cargar y renderizar la galería en tiempo real desde Firestore
  function renderGallery() {
    const container = document.getElementById('galleryContainer');
    if (!container) return;

    db.collection('photos').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No hay fotos disponibles.</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const photo = doc.data();
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${photo.img}" alt="${photo.title}">
          <h3>${photo.title}</h3>
        `;
        container.appendChild(item);
      });
    }, (error) => {
      console.error("Error al obtener imágenes: ", error);
    });
  }

  // 4. Función para guardar o subir un nuevo producto/foto
  async function saveProduct(title, fileInputOrUrl) {
    try {
      let imageUrl = '';

      if (fileInputOrUrl instanceof File) {
        const storageRef = storage.ref(`gallery_photos/${Date.now()}_${fileInputOrUrl.name}`);
        const uploadTask = await storageRef.put(fileInputOrUrl);
        imageUrl = await uploadTask.ref.getDownloadURL();
      } else {
        imageUrl = fileInputOrUrl;
      }

      await db.collection('photos').add({
        title: title,
        img: imageUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      console.log("¡Subido correctamente a Firebase!");
    } catch (error) {
      console.error("Error al guardar en Firebase: ", error);
      alert("Error al subir: " + error.message);
    }
  }

  // Inicializar al cargar la página
  document.addEventListener('DOMContentLoaded', () => {
    renderGallery();
  });
</script>
